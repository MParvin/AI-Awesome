name: Update Awesome README

on:
  schedule:
    - cron: "0 2 */2 * *"
  workflow_dispatch:
  push:
    paths:
      - "README.md"

permissions:
  contents: write

jobs:
  update:
    # Avoid infinite loops: skip pushes created by this workflow's own commits.
    if: >
      github.event_name != 'push' ||
      (
        github.actor != 'github-actions[bot]' &&
        (
          github.event.head_commit == null ||
          !contains(github.event.head_commit.message, '[skip categorize]')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        if: github.event_name != 'push'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate README
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.STARS_READ_TOKEN }}
        run: go run ./cmd/generate

      - name: Categorize projects with OpenRouter
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          # Free-tier models are rate-limited; be patient between batches.
          CATEGORIZE_BATCH_SIZE: "20"
          CATEGORIZE_BATCH_DELAY_SECONDS: "15"
          CATEGORIZE_MAX_RETRIES: "8"
          CATEGORIZE_RETRY_BASE_SECONDS: "30"
        run: python3 scripts/categorize_readme.py README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md categories.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update awesome README and project categories [skip categorize]"
          git push
